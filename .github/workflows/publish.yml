name: Publish to maven central

on:
  push:
    branches:
      - main
      - projectSetup # development 2025-11
    tags:
      - '**'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'
          check-latest: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: gradle build

      - name: Publish to Sonatype (for snapshots) or to Maven Central
        run: gradle publish closeAndReleaseStagingRepositories
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
